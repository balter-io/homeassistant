#           - !secret proxmox_ct_two
#           - !secret proxmox_ct_three
#           - !secret proxmox_ct_four
#           - !secret proxmox_vm_five

# influxdb/grafana
influxdb:
  username: !secret influx_username
  password: !secret influx_password

# overseerr
overseerr:
  host: !secret overseerr_host
  port: !secret overseerr_port
  api_key: !secret overseerr_api_key
  scan_interval: 600

# merged entities
group: !include groups.yaml
automation: !include_dir_merge_list automations/
script: !include scripts.yaml
sensor: !include_dir_merge_list sensors/
zone: !include zones.yaml
input_boolean: !include_dir_merge_named input-booleans/
input_select: !include_dir_merge_named input-select/
device_tracker: !include_dir_merge_list trackers/
notify: !include notify.yaml
