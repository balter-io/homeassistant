
# configure a default setup of Home Assistant (frontend, api, etc)
default_config:

frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  customize: !include customize.yaml

# access externally via the internet
http:
  ssl_certificate: /ssl/fullchain.pem
  ssl_key: /ssl/privkey.pem
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.0.126
    - 172.16.0.0/12

# mobile apps
mobile_app:

# google assistant
google_assistant:
  project_id: !secret google_assistant_project_id
  service_account: !include service-account.json
  report_state: true

# text to speach
tts:
  - platform: google_translate

# influxdb/grafana
influxdb:
  host: a0d7b954-influxdb
  port: 8086
  database: homeassistant
  username: !secret influx_username
  password: !secret influx_password
  max_retries: 3
  default_measurement: state

# merged entities
# group: !include groups.yaml
# automation: !include_dir_merge_list automations/
# script: !include scripts.yaml
sensors: !include_dir_merge_list sensors/
# zone: !include zones.yaml
# input_boolean: !include_dir_merge_named input-booleans/
# input_select: !include_dir_merge_named input-select/
# device_tracker: !include_dir_merge_list trackers/
# notify: !include notify.yaml
