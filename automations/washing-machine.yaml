- alias: Set washing machine to running
  trigger:
    - platform: numeric_state
      entity_id: sensor.washing_machine_mss310_power_w_main_channel
      above: 50
  action:
    - service: input_select.select_option
      data:
        entity_id: input_select.washing_machine_status
        option: Running

- alias: Set washing machine to complete
  trigger:
    - platform: numeric_state
      entity_id: sensor.washing_machine_mss310_power_w_main_channel
      below: 5
      for:
        minutes: 5
  action:
    - service: input_select.select_option
      data:
        entity_id: input_select.washing_machine_status
        option: Complete
    - service: notify.mobile_app_tim_s_s22_ultra
      data:
        message: "{% if now().hour > 9 or now().hour < 20 %} The washing machine cycle is complete. {% endif %}"
    - service: notify.mobile_app_tracey_s_samsung
      data:
        message: "{% if now().hour > 9 or now().hour < 20 %} The washing machine cycle is complete. {% endif %}"

- alias: Set washing machine to idle
  trigger:
    - platform: template
      value_template: "{% if is_state('input_select.washing_machine_status', 'Complete') %}true{% endif %}"
      for:
        minutes: 2
  action:
    - service: input_select.select_option
      data:
        entity_id: input_select.washing_machine_status
        option: Idle
