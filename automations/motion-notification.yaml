# notification for motion while we are away from home
- alias: 'Security Alert'
  trigger:
    platform: state 
    entity_id:
      - binary_sensor.entry_motion_sensor_motion_2
      - binary_sensor.kitchen_motion_sensor_motion_3
      - binary_sensor.hallway_motion_sensor_motion
    to: 'on'
  condition:
    condition: and
    conditions:
      - condition: template
        value_template: "{{ not is_state('person.tim', 'home') }}"
      - condition: template
        value_template: "{{ not is_state('person.tracey', 'home') }}"
  action:
    - delay: '00:01:00'
    - service: notify.clicksend
      data:
        message: 'Motion detected while nobody is home'